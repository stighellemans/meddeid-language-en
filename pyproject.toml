[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meddeid-language-en"
version = "0.2.4rc1"
description = "English en-GB and en-US language profiles for MedDeID"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{name = "Stig Hellemans"}]
keywords = ["de-identification", "clinical-nlp", "english", "healthcare"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["meddeid-core>=0.2.4rc1,<0.3"]

[project.urls]
Homepage = "https://stighellemans.github.io/meddeid/"
Documentation = "https://stighellemans.github.io/meddeid/concepts/architecture/"
Source = "https://github.com/stighellemans/meddeid-language-en"
Issues = "https://github.com/stighellemans/meddeid-language-en/issues"

[project.entry-points."meddeid.language_profiles"]
en = "meddeid_language_en.profiles:get_profile"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
meddeid-language-en-resources = "meddeid_language_en.resources:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meddeid_language_en = [
    "resources/**/*.json",
    "resources/**/*.jsonl",
    "resources/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
